<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Picture Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Apple-ish scrollbars */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100,100,100,0.3);
      border-radius: 9999px;
    }
  </style>
</head>

<body class="h-screen bg-neutral-100 text-neutral-800 overflow-hidden">

  <div class="flex h-full">

    <!-- LEFT SIDEBAR -->
    <aside class="w-64 bg-white/70 backdrop-blur-md border-r border-neutral-200 flex flex-col">
      <div class="p-4 font-semibold text-sm text-neutral-500 uppercase tracking-wide">
        Folders
      </div>

      <div class="flex-1 overflow-y-auto px-3 space-y-1 text-sm">
        <div class="px-2 py-1 rounded hover:bg-neutral-200 cursor-pointer">📁 Pictures</div>
        <div class="px-2 py-1 rounded hover:bg-neutral-200 cursor-pointer ml-4">Vacation</div>
        <div class="px-2 py-1 rounded hover:bg-neutral-200 cursor-pointer ml-4">RAW</div>
        <div class="px-2 py-1 rounded hover:bg-neutral-200 cursor-pointer">📁 Archive</div>
      </div>

      <div class="flex justify-center font-semibold text-sm text-neutral-500 uppercase tracking-wide">
        <button id="selectWorkingDir" class="bg-blue-200 p-2 mb-6">Select Working Directory</button>
      </div>
    </aside>


    <!-- CENTER AREA -->
    <main class="flex-1 flex flex-col">

      <!-- TITLE -->
      <header class="h-12 flex items-center justify-center border-b border-neutral-200 bg-white/60 backdrop-blur-md">
        <h1 class="text-sm font-medium tracking-wide">
          IMG_2847.CR3
        </h1>
      </header>

      <!-- IMAGE VIEW -->
      <div class="flex-1 flex items-center justify-center bg-neutral-50 relative">
        <div class="max-w-full max-h-full">
          <img
            src="https://placehold.co/1200x800"
            alt="Current"
            class="max-h-[80vh] shadow-xl object-contain"
          />
        </div>
      </div>

      <!-- FILMSTRIP -->
      <div class="h-28 border-t border-neutral-200 bg-white/70 backdrop-blur-md overflow-x-auto">
        <div class="flex items-center h-full px-4 space-x-3">

          <!-- Thumbnail -->
          <div class="w-24 h-20 rounded-lg overflow-hidden ring-2 ring-blue-500">
            <img src="https://placehold.co/200x200" class="w-full h-full object-cover" />
          </div>

          <div class="w-24 h-20 rounded-lg overflow-hidden hover:opacity-80 cursor-pointer">
            <img src="https://placehold.co/200x200" class="w-full h-full object-cover" />
          </div>

          <div class="w-24 h-20 rounded-lg overflow-hidden hover:opacity-80 cursor-pointer">
            <img src="https://placehold.co/200x200" class="w-full h-full object-cover" />
          </div>

        </div>
      </div>

    </main>


    <!-- RIGHT SIDEBAR -->
    <aside class="w-72 bg-white/70 backdrop-blur-md border-l border-neutral-200 flex flex-col">
      <div class="p-4 font-semibold text-sm text-neutral-500 uppercase tracking-wide">
        Details
      </div>

      <div class="flex-1 overflow-y-auto p-4 text-sm space-y-3">

        <div>
          <div class="text-neutral-400">Camera</div>
          <div class="font-medium">Canon EOS R5</div>
        </div>

        <div>
          <div class="text-neutral-400">Lens</div>
          <div class="font-medium">RF 24-70mm</div>
        </div>

        <div>
          <div class="text-neutral-400">Exposure</div>
          <div class="font-medium">1/250 • f/2.8 • ISO 100</div>
        </div>

        <div>
          <div class="text-neutral-400">Rating</div>
          <div class="font-medium">★★★★★</div>
        </div>

        <div>
          <div class="text-neutral-400">Tags</div>
          <div class="flex flex-wrap gap-2 mt-1">
            <span class="px-2 py-1 bg-neutral-200 rounded-full text-xs">Vacation</span>
            <span class="px-2 py-1 bg-neutral-200 rounded-full text-xs">Portrait</span>
          </div>
        </div>

      </div>
    </aside>

  </div>

</body>
</html>
